name: Update sitemap

# Runs the sitemap generator whenever a page, the pages config, or the
# blog data file changes, then commits sitemap.xml + sitemap.html back
# to the repo. This is what makes "add a blog post -> it's in the
# sitemap" and "delete a blog post -> it's out of the sitemap" happen
# automatically on GitHub Pages, which has no server of its own to run
# scripts/generate-sitemap.js for you.

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/js/blog-data.js"
      - "scripts/pages.json"
      - "scripts/generate-sitemap.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml + sitemap.html
        run: node scripts/generate-sitemap.js

      - name: Commit changes if the sitemap actually changed
        run: |
          git config user.name "flexora-sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- sitemap.xml sitemap.html; then
            git add sitemap.xml sitemap.html
            git commit -m "chore: auto-update sitemap [skip ci]"
            git push
          else
            echo "No sitemap changes to commit."
          fi
