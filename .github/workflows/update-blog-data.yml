name: Update blog-data.js

# Runs automatically whenever you add, edit, or delete a file in /blog/,
# and commits the regenerated assets/js/blog-data.js back for you.
# You can also trigger it manually from the Actions tab ("Run workflow").
# This workflow deliberately does NOT touch blog.html, sitemap.xml, or
# sitemap.html — only assets/js/blog-data.js.

on:
  push:
    branches: [main]
    paths:
      # Single star matches files directly inside /blog/ only — this MUST
      # stay in sync with scripts/update_blog_data.py's glob.glob(), which
      # is also non-recursive. If you ever make the script scan subfolders,
      # change this to "blog/**.html" (double star) too, or pushes into a
      # subfolder will trigger a run that silently finds nothing.
      - "blog/*.html"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-blog-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the update script
        run: python3 scripts/update_blog_data.py

      - name: Commit and push changes, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/blog-data.js
          if git diff --cached --quiet; then
            echo "Nothing changed — blog-data.js is already up to date."
          else
            git commit -m "Auto-update blog-data.js [skip ci]"
            git pull --rebase origin main
            git push
          fi
